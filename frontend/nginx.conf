server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  # Backstop only — the API enforces MAX_UPLOAD_MB itself (default 25 MB) and returns a clean 413.
  client_max_body_size 50m;

  location /api/ {
    # The backend sets its own security headers (app.middleware.SecurityHeadersMiddleware) on
    # every response, including errors — don't add them again here, nginx's add_header would
    # duplicate rather than replace them since this response already carries the upstream's.
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Angular's build hashes JS/CSS filenames, so those are safe to cache aggressively; index.html
  # itself must always be revalidated or a deploy could leave clients on stale hashed assets.
  # (nginx's add_header does not inherit from the server block once a location sets its own, so
  # the security headers are repeated in both static locations below rather than set once above.)
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
  }
}
