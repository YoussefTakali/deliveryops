name: deliveryops

services:
  postgres:
    container_name: deliveryops-postgres
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: deliveryops
      POSTGRES_USER: deliveryops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deliveryops}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliveryops"]
      interval: 5s
      retries: 20

  keycloak:
    container_name: deliveryops-keycloak
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm --http-port 8280
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: deliveryops
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-deliveryops}
    volumes:
      - ./infra/keycloak/realm-deliveryops.json:/opt/keycloak/data/import/realm-deliveryops.json:ro
    ports: ["8280:8280"]
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    container_name: deliveryops-backend
    build: ./backend
    command: ["api"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://deliveryops:${POSTGRES_PASSWORD:-deliveryops}@postgres:5432/deliveryops
      KEYCLOAK_ISSUER: http://localhost:8280/realms/deliveryops
      KEYCLOAK_JWKS_URL: http://keycloak:8280/realms/deliveryops/protocol/openid-connect/certs
      CORS_ORIGINS: http://localhost:4300
      FRONTEND_URL: http://localhost:4300
      SEED_DEMO_DATA: "true"
      # Hugging Face's "xet" CDN host is not always DNS-resolvable inside the container, which stalls
      # model downloads (fastembed embeddings, faster-whisper) forever. Force the classic huggingface.co
      # path, which resolves reliably.
      HF_HUB_DISABLE_XET: "1"
      # fastembed (app/knowledge.py) caches to /tmp by default → wiped on every rebuild (~450MB
      # re-download). Point it inside the persisted, user-writable HF cache volume below.
      FASTEMBED_CACHE_PATH: /home/deliveryops/.cache/huggingface/fastembed
    ports: ["8100:8000"]
    volumes:
      # Drop the built desktop installer here and it's served at /api/download/desktop (no rebuild).
      - ./backend/downloads:/app/downloads
      # faster-whisper (app/stt.py) + fastembed (via FASTEMBED_CACHE_PATH) download model weights from
      # Hugging Face on first use; persist the cache so a rebuild doesn't re-download hundreds of MB.
      - whisper-cache:/home/deliveryops/.cache/huggingface
    depends_on:
      postgres: { condition: service_healthy }

  # Optional: expose DeliveryOps tools to external assistants over MCP (docker compose --profile mcp up)
  mcp:
    container_name: deliveryops-mcp
    build: ./backend
    profiles: ["mcp"]
    command: ["mcp"]
    healthcheck: { disable: true }  # serves the MCP protocol on 8765, not /api/health
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://deliveryops:${POSTGRES_PASSWORD:-deliveryops}@postgres:5432/deliveryops
      DELIVERYOPS_USER: ${MCP_USER:-sarah}
    ports: ["8765:8765"]
    depends_on:
      postgres: { condition: service_healthy }

  frontend:
    container_name: deliveryops-frontend
    build: ./frontend
    ports: ["4300:80"]
    depends_on: [backend]

volumes:
  pgdata:
    name: deliveryops-pgdata
  whisper-cache:
    name: deliveryops-whisper-cache

networks:
  default:
    name: deliveryops-net
